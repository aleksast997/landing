<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Landing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300&family=Roboto:wght@400;500;700&display=swap">
</head>
<body id="top">
<main>
    <header class="site-header">
        <div class="main-text">Top antivirus</div>
        <div class="separator"></div>
        <div class="sub-text">
            <span>PC APP STORE</span>
            <span class="trademark">™</span>
        </div>
    </header>
    <img src="./src/assets/download_pointer.svg" class="pointer" alt="" hidden />
    <div class="layout">
        <span class="title">thank you for choosing our product !</span>
        <div id="cards-container" class="pricing-grid"></div>
    </div>

    <footer class="site-footer">
        <div class="main-text">Top antivirus</div>
        <div class="sub-text">
            <span>Copyright © 2021</span>
        </div>
    </footer>
</main>

<!-- Hidden Component Template -->
<template id="pricing-card-template">
    <div class="pricing-card">
        <img src="./src/assets/50OFF.svg" class="card-image" alt="" />
        <div class="card-header">
            <div class="tag-info"></div>
            <div class="price-wrapper">
                <div class="price"></div>
                <div class="time-period"></div>
            </div>
        </div>
        <div class="card-body">
            <span class="description"></span>
            <span class="condition"></span>
            <button class="btn-download">
                <span>Download</span>
                <img src="./src/assets/download_icon.svg" class="icon" alt="" />
            </button>
        </div>
    </div>
</template>
<script type="module" src="/src/main.js"></script>
</body>
</html>
